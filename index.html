<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Noite a Dois">
<meta name="theme-color" content="#0d1430"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:#0d1430;color-scheme:dark;-webkit-text-size-adjust:100%}body{margin:0;height:100%;font:14px system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}input,textarea{-webkit-user-select:text;user-select:text}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Noite a Dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Mode toggle, scoreboard, one tile-framed play card, actions underneath. Single dark look. */
:root{
  --night:#0d1430; --night2:#151e45; --line:#26346f; --tile:#2c55b8;
  --port:#c7305e; --cream:#f4ebd9; --ink:#141a35; --gold:#eab14b; --muted:#9aa6cf; --good:#3fae7a; --paper2:#d8cfbd; --pinkish:#ff7aa2;
  --display:"Young Serif",Georgia,serif; --body:"Outfit",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;background-image:radial-gradient(circle at 50% -10%, rgba(199,48,94,.22), transparent 55%);}
html,body{overflow:hidden}
.shell{display:flex;height:100%;min-height:0}
.main{flex:1;min-width:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:var(--wrap,560px);margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0}
h1 span{color:var(--port)}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{border:none;border-radius:12px;padding:14px 12px;font-weight:600;font-size:1rem}
.go{background:var(--gold);color:var(--ink)}
.red{background:var(--port);color:var(--cream)}
.ghost{background:var(--night2);color:var(--cream);border:1px solid var(--line)}
.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.w100{width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field textarea{background:var(--night2);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:11px 12px;font:500 1rem var(--body);width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical;font-weight:400;font-size:.95rem}
.seg{display:flex;background:var(--night2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font-weight:600;padding:9px 4px;border-radius:9px;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.seg.big button{padding:12px 4px;font-size:1rem}
.seg.big button[aria-pressed=true]{background:var(--port);color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 11px;border-radius:999px;font-weight:500;font-size:.85rem}
.chips button[aria-pressed=true]{background:var(--tile);border-color:var(--tile);color:var(--cream)}
.chips.hot button[aria-pressed=true]{background:var(--port);border-color:var(--port)}
.chips.afro button[aria-pressed=true]{background:#c9782f;border-color:#c9782f}
.chips.fight button[aria-pressed=true]{background:#3a8f6a;border-color:#3a8f6a}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:none;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:2px 0}
.note{color:var(--muted);font-size:.86rem;line-height:1.45;margin:0}
details{background:var(--night2);border:1px solid var(--line);border-radius:12px;padding:12px}
details summary{cursor:pointer;font-weight:600}
details.deck{border-color:var(--port)}
details.deck .dc{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:2px}
details[open] summary{margin-bottom:10px}

.board{background:var(--night2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.brow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:10px 14px;font-variant-numeric:tabular-nums}
.brow+.brow{border-top:1px solid var(--line)}
.nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.nm i{width:8px;height:8px;border-radius:50%;background:transparent;flex:0 0 auto}
.brow.turn .nm i{background:var(--gold)}
.g{font-family:var(--display);font-size:1.6rem;min-width:1.2em;text-align:right;color:var(--gold)}
.pips{display:flex;gap:4px}
.pips b{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.pips b.on{background:var(--cream);border-color:var(--cream)}
.bhead{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:8px 14px 0;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bank{padding:8px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bank b{color:var(--pinkish)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{border-radius:18px;padding:12px;background:var(--tile);background-image:radial-gradient(circle at 0 0,transparent 9px,rgba(255,255,255,.18) 10px 12px,transparent 13px),radial-gradient(circle at 100% 100%,transparent 9px,rgba(255,255,255,.18) 10px 12px,transparent 13px),linear-gradient(45deg,rgba(255,255,255,.08) 25%,transparent 25% 75%,rgba(255,255,255,.08) 75%);background-size:28px 28px}
.inner{background:var(--cream);color:var(--ink);border-radius:10px;min-height:220px;padding:20px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}
.inner.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
.kick{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#8e1d41;font-weight:700}
.big{font-family:var(--display);font-size:1.45rem;line-height:1.3;margin:0;text-wrap:balance}
.huge{font-family:var(--display);font-size:2.3rem;line-height:1.1;margin:0}
.hint{font-size:.88rem;color:#4b5375;line-height:1.4;margin:0}
.timer{font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--port)}
.blur{filter:blur(9px);user-select:none;cursor:pointer}
.dice{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.die{background:var(--ink);color:var(--cream);border-radius:12px;padding:10px 12px;font-weight:600;min-width:88px}
.die small{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.tal{display:flex;gap:18px;justify-content:center;font-weight:600;font-variant-numeric:tabular-nums}
.tal b{font-family:var(--display);font-size:1.8rem;font-weight:400;display:block}
.cd{font-family:var(--display);font-size:2.4rem;min-height:1.2em;color:var(--port)}
.fz{font-family:var(--display);font-size:2.8rem;color:var(--port);min-height:1.1em}
.pcard{width:84px;height:118px;border-radius:10px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:2.2rem}
.pcard.redsuit{color:var(--port)}
.tick{font-family:var(--display);font-size:2.4rem;animation:tick .5s ease-in-out infinite alternate}
@keyframes tick{to{transform:scale(1.15)}}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{background:var(--night2);border:1px solid var(--line);color:var(--cream);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.pick button.sexy{border-color:rgba(199,48,94,.6)}
.pick button.afro{border-color:rgba(201,120,47,.7)}
.pick button.fight{border-color:rgba(58,143,106,.7)}
.pick button b{font-family:var(--display);font-weight:400;font-size:1rem}
.pick button span{font-size:.75rem;color:var(--muted);line-height:1.3}

.word{font-family:var(--display);font-size:1.5rem;letter-spacing:.16em;word-break:break-word}
.lives{display:flex;gap:5px;justify-content:center}
.lives b{width:14px;height:14px;border-radius:3px;background:var(--port)}
.lives b.off{background:var(--paper2)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
.keys button{border:none;border-radius:7px;padding:9px 0;background:var(--ink);color:var(--cream);font-weight:600;font-size:.9rem}
.keys button:disabled{opacity:.25}
.keys button.hit{background:var(--good);opacity:1}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;max-width:300px}
.grid5 button{aspect-ratio:1;border:none;border-radius:7px;background:var(--tile);color:var(--cream);font-size:1.1rem;font-weight:700;max-width:100%}
.grid5 button.miss{background:var(--paper2);color:#7a7f96}
.grid5 button.hit{background:var(--port)}
.grid5 button.sunk{background:var(--ink)}
.tally{display:flex;gap:16px;font-size:.9rem;font-weight:600;flex-wrap:wrap;justify-content:center}
.qd{display:flex;flex-direction:column;gap:10px}
.qd button{border-radius:16px;min-height:150px;font-family:var(--display);font-size:1.5rem;color:var(--cream);background:var(--night2);border:2px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.qd button.flipme{transform:rotate(180deg)}
.qd .sig{text-align:center;font-family:var(--display);font-size:1.6rem;padding:6px}
.qd.go button{background:var(--good);border-color:var(--good)}

/* board game */
.bgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));gap:2px;width:100%;aspect-ratio:1;max-width:100%}
.sq{position:relative;background:var(--night2);border:1px solid var(--line);border-radius:5px;padding:3px 1px 1px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:.48rem;line-height:1.05;text-align:center;overflow:hidden;min-width:0;word-break:break-word;cursor:pointer;color:var(--cream)}
.sq.spec{background:color-mix(in srgb,var(--k,#151e45) 24%,var(--night2))}
.sq .strip{position:absolute;left:0;right:0;top:0;height:4px}
.sq .lab{margin-top:2px;font-weight:600}
.sq .ic{font-size:.72rem;line-height:1;color:var(--k,var(--cream))}
.sq .lvl{font-size:.4rem;letter-spacing:1px;line-height:1}
.sq.corner{background:#1d2858}
.sq.corner .lab{color:var(--gold)}
.sq.o0{background:rgba(64,140,255,.5);border-color:#5aa9ff;box-shadow:0 0 7px rgba(90,169,255,.8)}
.sq.o1{background:rgba(255,105,170,.45);border-color:#ff7aa2;box-shadow:0 0 7px rgba(255,122,162,.8)}
.sq.here{outline:2px solid var(--cream);outline-offset:-2px}
.toks{display:flex;gap:1px;min-height:10px}
.tok{width:12px;height:12px;border-radius:50%;font-size:.5rem;font-weight:700;display:inline-grid;place-items:center;color:var(--ink);flex:0 0 auto}
.sq .tok{width:10px;height:10px;font-size:.42rem}
.tok.t0{background:#5aa9ff}
.tok.t1{background:var(--pinkish)}
.tok.me{box-shadow:0 0 0 2px var(--cream)}
.center{grid-area:2/2/9/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:6px}
.logo{font-family:var(--display);font-size:1.3rem;line-height:1}
.logo span{color:var(--port);font-size:.9rem}
.dd{display:flex;gap:8px}
.dd b{width:40px;height:40px;border-radius:9px;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:1.3rem}
.dd.spin b{animation:spin .4s ease}
@keyframes spin{from{transform:rotate(-200deg) scale(.6)}to{transform:none}}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--night2);border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pc.me{border-color:var(--gold)}
.ps{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ps b{color:var(--cream);font-size:1rem}
.cl{display:flex;gap:3px;flex-wrap:wrap}
.cl i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.cl i.on{background:var(--pinkish)}
.cash{font-family:var(--display);font-size:1.25rem;color:var(--gold);font-variant-numeric:tabular-nums}
.bankp{display:flex;flex-direction:column;gap:8px;background:var(--night2);border:1px solid var(--line);border-radius:12px;padding:10px}
.bankp .btn{flex:1 1 auto}
.bankp .btn:disabled{opacity:.4}
.sq.mort{opacity:.45}
.cbrow{padding:0 14px 10px}
.cbrow .btn{width:100%}
.recap .rr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;align-items:center}
.recap .rr b{font-family:var(--display);font-weight:400;font-size:1.3rem;text-align:center;color:var(--cream)}
.recap .rr.head b{font-family:var(--body);font-weight:600;font-size:.85rem;color:var(--gold)}
.recap .awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.recap .awards div{background:var(--night);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.recap .awards b{font-family:var(--display);font-weight:400;font-size:1rem;overflow-wrap:anywhere}
.gsub a{color:#6a46c9;font-weight:600}
a.btn{text-decoration:none;display:inline-block}
.alert.unlock,.alert.remind{background:#6a46c9;color:#fff}
.alert .btn.gonow{background:var(--cream);color:var(--ink)}
.lvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lvgrid button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--night);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:8px 10px;min-width:0}
.lvgrid b{font-family:var(--display);font-weight:400;font-size:1.3rem;min-width:1.4em;color:var(--gold)}
.lvgrid span{font-size:.78rem;color:var(--muted);line-height:1.2}
.ckres{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ckres .note{grid-column:1/-1}
.cklv{font-family:var(--display);font-size:2rem;color:var(--gold)}
.cklv small{font-size:.9rem;color:var(--muted)}
.cutsetup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--night2);border:1px dashed var(--line);border-radius:12px;padding:12px}
.cutsetup.open{border:1px solid #a27bff;box-shadow:0 0 12px rgba(162,123,255,.35)}
.cutsetup>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px}
.testban{background:var(--gold);color:var(--ink);font-weight:700;text-align:center;padding:6px;border-radius:8px;font-size:.85rem;letter-spacing:.06em}
.cutcard{background:#6a46c9}
.steps{text-align:left;margin:0;padding-left:18px;font-size:.92rem;line-height:1.5;color:#3b4160}
.qtxt{cursor:pointer}
textarea.secret{width:100%;min-height:90px;border-radius:10px;border:1px solid #c9bfae;padding:10px;font:500 1rem var(--body);background:#fff;color:var(--ink);-webkit-text-security:disc}
.mlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.92rem;line-height:1.45}
.dg{display:flex;flex-direction:column;gap:4px}
.dg svg{width:100%;height:auto;background:var(--night);border-radius:10px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:10px 12px;font:500 1rem var(--body)}
.dkin.secret{-webkit-text-security:disc}
.dkchips{display:flex;flex-wrap:wrap;gap:6px}
.dkchip{display:inline-flex;align-items:center;gap:4px;background:var(--night);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:.7rem;letter-spacing:2px;color:var(--muted)}
.dkchip.p0{border-color:#5aa9ff;color:#5aa9ff}
.dkchip.p1{border-color:#ff7aa2;color:#ff7aa2}
.dkchip button{background:none;border:none;color:var(--muted);font-size:1rem;line-height:1;padding:2px 6px;letter-spacing:0}
.bkcode{width:100%;min-height:80px;background:var(--night);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px;font:400 .75rem ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
.bknudge{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(234,177,75,.12);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:.88rem}
.bstack,.bcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.bside{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:899px){.bside{display:flex;flex-direction:column;gap:14px}}
.nav{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;width:13.5rem;padding:18px 12px;background:var(--night2);border-right:1px solid var(--line);overflow-y:auto}
.brand{font-family:var(--display);font-size:1.45rem;padding:4px 10px 14px;color:var(--cream)}
.brand span{color:var(--port)}
.ntab{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--muted);font:600 .95rem var(--body);padding:11px 12px;border-radius:10px;text-align:left}
.ntab:hover{background:rgba(255,255,255,.04);color:var(--cream)}
.ntab[aria-current=page]{background:var(--night);color:var(--cream);box-shadow:inset 3px 0 0 var(--port)}
.nic{width:1.4em;text-align:center;font-size:1.05rem}
.ndot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:0 0 auto}
.ndot.live{background:var(--good);box-shadow:0 0 6px var(--good)}
.ndot.hot{background:#a27bff;box-shadow:0 0 6px #a27bff}
.ndot.warn{background:var(--gold)}
.nscore{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.nscore b{font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--cream)}
.ptitle{font-size:1.6rem}
.panel{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:0;color:var(--cream)}
.panel .seg{background:var(--night)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.cols>.stack{gap:14px}
.startbox{position:sticky;bottom:0}
.steps.light{color:var(--cream)}
@media (min-width:900px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bside .bgrid{width:min(100%,calc(100dvh - 150px));margin-inline:auto}
}
@media (max-width:899px){
  .shell{flex-direction:column}
  .main{order:1}
  .nav{order:2;flex-direction:row;width:100%;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:none;border-top:1px solid var(--line);overflow-x:auto;gap:2px}
  .brand,.nscore{display:none}
  .ntab{flex:1 1 0;flex-direction:column;gap:2px;padding:7px 2px;font-size:.66rem;text-align:center;min-width:56px}
  .ntab[aria-current=page]{box-shadow:inset 0 3px 0 var(--port)}
  .nic{font-size:1.15rem;width:auto}

function vRules(){

  <section><h3>Goal</h3><p>You each start with ${money(S.bCash||1500)}. Bankrupt your partner to win. End the game early and whoever's worth more (cash plus spots) wins. The loser drinks the ${esc(S.matchCost.toLowerCase())}.</p></section>

  <section><h3>Quick game</h3><p>£1,000 each, rent is 50% higher, and there's a 45-minute clock that stops while you're paused or filming The Cut. When time's up, whoever's worth more wins.</p></section>
  <section><h3>Buying</h3><p>Land on an unowned spot and buy it at its price. Pass on it, or can't afford it, and it goes to auction: you both bid, highest bid wins.</p></section>
  <section><h3>Rent</h3><p>Land on your partner's spot and you pay the rent money and do the dirty bit. You can strip or drink 2 instead of the dirty bit, but the money always gets paid. Naughtier spots cost more and earn more.</p></section>
  <section><h3>Upgrades</h3><p>Land on your own spot to upgrade it, for half its price per level, up to level 3. Each level raises the rent money and makes the dirty bit filthier. At level 3 the owner decides. After that, build a Penthouse for the full price: bigger rent, and the visitor takes a shot too. Own a whole colour set and rent doubles.</p></section>
  <section><h3>Trading</h3><p>On your turn, tap Trade. Swap spots and cash, and throw in a sweetener like a lap dance. Your partner says Deal or No deal.</p></section>
  <section><h3>Mortgages</h3><p>Mortgage a spot for half its price any time on your turn. It earns no rent until you land on it and pay off 55% of the price.</p></section>
  <section><h3>Big Spender</h3><p>First to £3,000 cash gets a striptease from their partner.</p></section>
  <section><h3>Short on cash</h3><p>Do dares for £100 each, mortgage spots, or sell them back to the bank for half their value. Still can't pay? You're bankrupt and you lose.</p></section>
  <section><h3>The bank</h3><p>On your turn you can earn £100 with a dare or visit the Power shop: Reverse Rent £200, Command £150, Rent Free £100. Either of you can pay £100 to make the other take a shot. On any forfeit you can offer a bribe of £50, £100 or £200 to skip it.</p></section>
  <section><h3>Clothes</h3><p>You each start with ${S.bClothes} items. Strip Tax, rent and Chance take them off.</p></section>
  <section><h3>Kiss Jar</h3><p>Every time someone drinks instead, a kiss and £50 go in the jar. Strip Tax and bail go in too. Land on the Kiss Jar corner and collect the lot.</p></section>
  <section><h3>Jail</h3><p>Take a shot or pay £50 bail to get out and roll. Do neither and you lose the turn.</p></section>
  <section><h3>Shot clock</h3><p>${S.shotEvery?`Every ${S.shotEvery} rounds, the screen flashes SHOT TIME and you both take one.`:"Off. Turn it on in setup."} Any time someone drinks, DRINK TIME flashes up.</p></section>
  <section><h3>Every square</h3><p>Tap any square on the board, or open the Guide, to see prices, rent and what it does.</p></section>`;
  else body=`<h2>Head to head rules</h2>
  <section><h3>The match</h3><p>Each round is one mini-game. Win it, get a point. First to ${S.toWin} points wins a game and the loser drinks (${esc(S.gameCost.toLowerCase())}). First to ${S.gamesToWin} games wins the match and the loser drinks the ${esc(S.matchCost.toLowerCase())}.</p></section>
  <section><h3>Shot time and drink time</h3><p>The screen flashes SHOT TIME or DRINK TIME whenever someone has to drink, so nobody forgets. Losing a game is a ${esc(S.gameCost.toLowerCase())}. ${S.shotEvery?`The shot clock makes you both take a shot every ${S.shotEvery} rounds.`:"The shot clock is off."}</p></section>
  <section><h3>Comeback card</h3><p>Behind by 3 or more points? Once per game you can steal a point from the leader.</p></section>
  <section><h3>Sudden death</h3><p>Tap Sudden death any time. One quick round, and the winner takes the whole match.</p></section>
  <section><h3>Heat rises</h3><p>Turn it on in setup and the heat goes up one level after every game, Clean to Flirty to Filthy.</p></section>
  <section><h3>Slave for 5</h3><p>Whoever wins a game gets 5 minutes of total control over the loser, within your limits.</p></section>
  <section><h3>Spank Bank</h3><p>Every point you lose adds a spank to your bank. Cash it all in when the match ends.</p></section>
  <section><h3>Picking games</h3><p>Random mode picks for you. Loser-picks mode lets whoever lost the last round choose. The yellow dot shows whose turn it is.</p></section>
  <section><h3>Heat</h3><p>Clean, Flirty or Filthy. Changes the sexy games, charades, sentences and hangman. Change it any time.</p></section>
  ${GROUPS.map(([g,l])=>`<h4>${l}</h4>`+inGroup(g).map(k=>`<section><h3>${GAMES[k].name}</h3><p>${GAMES[k].rule}</p></section>`).join("")).join("")}`;
  return `<div class="over" data-a="close"><div class="box rules" role="dialog" aria-label="Rules">${body}
  <section><h3>Tipsy check</h3><p>Every few drinks the app asks how drunk you each are, 1 to 10. You rate yourself and each other, and the app shows its own guess.</p></section>
  <section><h3>The Cut</h3><p>Once you're both past 7, The Cut unlocks. Pause any game, film a private interview on your second phone while the other wears earbuds, then go back to the game exactly where you left it. Watch it the next morning from Morning after on the setup screen.</p></section>
  <section><h3>House rules</h3><p>Can't agree who won? Both drink and replay. Anyone can pass on anything, no questions, and just drinks instead.</p></section>
  <button class="btn go" data-a="close">Got it</button></div></div>`;
}

  else if(ov==="trade"&&tr)o=vTrade();

function vBOver(){const w=S.winner,b=S.b,wv=[0,1].map(worth);
  const stats=`<p class="hint">Worth: ${N(0)} ${money(wv[0])} · ${N(1)} ${money(wv[1])}</p><p class="hint">Drinks: ${N(0)} ${b.drinks[0]} · ${N(1)} ${b.drinks[1]} · Clothes left: ${N(0)} ${b.clothes[0]} · ${N(1)} ${b.clothes[1]}</p>`;
  const btns=`<div class="row"><button class="btn go" data-a="bstart">Play again</button><button class="btn ghost" data-a="menu">Setup</button></div><button class="btn ghost" data-a="recap">Night recap</button>`;
  if(w<0)return head()+`<div class="card"><div class="inner"><div class="potion" aria-hidden="true">🧪</div><div class="kick">Dead heat</div><p class="big">Exactly the same worth. You both drink the ${esc(S.matchCost.toLowerCase())}.</p>${stats}</div></div>${btns}`;
  const l=1-w;return head()+`<div class="card"><div class="inner"><div class="potion" aria-hidden="true">🧪</div><div class="kick">${S.bankrupt!=null?`${N(l)} went bankrupt`:S.timeUp?`Time's up · ${N(w)} is richer`:`${N(w)} is richer`}</div><p class="big">${N(w)} wins. ${N(l)}: ${esc(S.matchCost)}, all of it.</p><p class="hint">${N(w)} gets one wish, cashed in tonight.</p>${stats}</div></div>${btns}`}
function runClock(){timer=setInterval(()=>{const r=S.r;if(!r){stopTimers();return}r.t--;
  if(r.g==="freeze"){if(r.fz>0){r.fz--}else{r.nx--;if(r.nx<=0){r.fz=6;r.nx=5+rnd(8);buzz(250)}}const f=$("fz");if(f)f.textContent=r.fz>0?"FREEZE!":""}
  const el=$("tm");if(el){el.textContent=Math.max(r.t,0);el.classList.toggle("low",r.t<=10)}
  if(r.t<=0){clearInterval(timer);timer=null;const f=$("fz");if(f)f.textContent="";toast("Time's up");buzz(300)}save()},1000)}
function runCat(){timer=setInterval(()=>{const r=S.r;r.t--;const el=$("tm");if(el){el.textContent=Math.max(r.t,0);el.classList.toggle("low",r.t<=2)}

function runBomb(){timer=setInterval(()=>{const r=S.r;r.fuse--;if(r.fuse<=0){clearInterval(timer);timer=null;r.stage=2;buzz([200,80,400]);sfx("bomb");save();render(true)}},1000)}

    case "bkcopy":{const t=$("bkout");if(!t)return;const done=()=>toast("Copied");try{navigator.clipboard.writeText(t.value).then(done,()=>{t.focus();t.select();toast("Selected. Tap Copy in the menu")})}catch(err){t.focus();t.select();toast("Selected. Tap Copy in the menu")}return}
    case "bkrestore":{const v=($("bkin")||{}).value||"";let data;try{data=readBackup(v)}catch(err){return toast("That code doesn't look right. Paste the whole thing")}
      if(!S.bkArm){S.bkArm=true;S.bkPending=v;render();const n=$("bkin");if(n)n.value=v;return}
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),data);S.undo=[];S.bkArm=false;S.bkCode="";S.bkDirty=false;S.cutOn=false;if(S.b)S.b.moving=false;alertQ=[];ov=null;save();toast("Backup restored");return render(true)}
    case "recap":ov="recap";S.resetArm=false;return render();
    case "nightreset":if(!S.resetArm){S.resetArm=true;return render()}S.resetArm=false;S.night={shots:[0,0],drinks:[0,0],forfeits:[0,0],strip:[0,0],wins:[0,0],games:{}};S.spank=[0,0];S.drunk={levels:[],unlocked:false,used:false,lastCheck:0,rem:0};ov=null;save();toast("Fresh night");return render();
    case "bendyes":ov=null;endBoard();save();return render(true);
    case "pause":stopTimers();ov="pause";S.pausedAt=Date.now();return render();
    case "unpause":ov=null;if(S.b&&S.b.endAt&&S.pausedAt)S.b.endAt+=Date.now()-S.pausedAt;S.pausedAt=null;save();return render();
    case "hresume":S.phase=S.hWas;S.hWas=null;save();return render(true);
    case "swapp":swapPlayers();save();return render();
  }
});
let AC=null;function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function tone(f,d,type,t0,vol,f2){if(!AC)return;const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol){if(!AC)return;const n=AC.sampleRate*d,buf=AC.createBuffer(1,n,AC.sampleRate),c=buf.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const src=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol||.5;src.buffer=buf;src.connect(g).connect(AC.destination);src.start()}
function sfx(k){if(!S.sound||!AC)return;try{
  if(k==="shot"){tone(140,.5,"sawtooth",0,.25,60);tone(140,.5,"square",.25,.15,50)}
  else if(k==="drink"){tone(660,.12,"triangle",0,.25);tone(880,.18,"triangle",.12,.25)}
  else if(k==="forfeit"){[740,587,440].forEach((f,i)=>tone(f,.18,"square",i*.15,.12))}
  else if(k==="cash"){tone(1320,.08,"square",0,.12);tone(1760,.25,"sine",.08,.2)}
  else if(k==="bomb"){noise(.9,.7);tone(90,.8,"sawtooth",0,.3,30)}
  else if(k==="dice"){for(let i=0;i<6;i++)tone(300+Math.random()*500,.03,"square",i*.06,.08)}
  else if(k==="go"){[523,659,784,1047].forEach((f,i)=>tone(f,.15,"triangle",i*.09,.2))}
  else if(k==="point"){tone(880,.1,"sine",0,.18)}
}catch(e){}}
let wl=null;function keepAwake(){audio();try{if(navigator.wakeLock&&(!wl||wl.released))navigator.wakeLock.request("screen").then(l=>{wl=l}).catch(()=>{})}catch(e){}}
keepAwake();document.addEventListener("pointerdown",keepAwake,{passive:true});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});
render();
</script>
